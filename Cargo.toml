[workspace]
members = ["crates/dgs", "crates/dgs-macros"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xyndra/dgs"

[workspace.dependencies]
dgs-macros = { version = "0.1.0", path = "crates/dgs-macros" }
serde = { version = "1.0", features = ["derive"] }
